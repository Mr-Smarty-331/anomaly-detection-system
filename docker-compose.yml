# version: '5.0.0' this is redundant for modern versions
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - anomaly-detection-network


  kafka:
    # using a pre-built Docker image for Kafka
    image: confluentinc/cp-kafka:7.3.0
    hostname: kafka
    container_name: kafka
    
    depends_on:
      - zookeeper
    # Map port 9092 on the host machine to port 9092 in the container.
    ports:
      - "9092:9092"
    # Environment variables to configure Kafka.
    environment:
      # The unique ID for this broker in the Kafka cluster.
      KAFKA_BROKER_ID: 1
      # The address of the Zookeeper service. Note we use the service name 'zookeeper'.
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - anomaly-detection-network


  python-app:

    build: .
    hostname: python-app
    container_name: python-app

    depends_on:
      - kafka

    volumes:
      - .:/app

    working_dir: /app

    command: tail -f /dev/null
    networks:
      - anomaly-detection-network

  influxdb:
    image: influxdb:2.9.1
    container_name: influxdb
    # This ensures it pulls the native M1 version
    platform: linux/arm64
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=Ayush
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=individual
      - DOCKER_INFLUXDB_INIT_BUCKET=anomaly-detection
      # This is a random 64-character token required by version 2.9.1+ to bypass setup
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    networks:
      - anomaly-detection-network

networks:
  anomaly-detection-network:
    driver: bridge

volumes:
  influxdb-data:
