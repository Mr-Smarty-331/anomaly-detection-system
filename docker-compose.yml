# version: '5.0.0' this is redundant for modern versions
x-python-base: &python-base-service
  # All Python services will be built from the Dockerfile in the current directory.
  build: .
  # Mount the current directory on the host into the /app directory in the container.
  # This allows for live code changes without rebuilding the image (great for development).
  volumes:
    - ./:/app
  # All Python services will connect to our shared network.
  networks:
    - anomaly-detection-network

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - anomaly-detection-network


  kafka:
    # using a pre-built Docker image for Kafka
    image: confluentinc/cp-kafka:7.3.0
    hostname: kafka
    container_name: kafka
    
    depends_on:
      - zookeeper
    # Map port 9092 on the host machine to port 9092 in the container.
    ports:
      - "9092:9092"
    # Environment variables to configure Kafka.
    environment:
      # The unique ID for this broker in the Kafka cluster.
      KAFKA_BROKER_ID: 1
      # The address of the Zookeeper service. Note we use the service name 'zookeeper'.
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - anomaly-detection-network

  producer:
    # Use the '<<:' key to merge the properties from our python-base-service alias.
    <<: *python-base-service
    container_name: producer
    # The command to run when the container starts. This executes our producer script.
    command: python producer.py
    # This service will not start until the 'kafka' service has started.
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER_URL=kafka:29092
      - RAW_DATA_TOPIC=raw-data

  # consumer:
  #   <<: *python-base-service
  #   container_name: consumer
  #   # This command executes our main consumer script.
  #   command: python consumer.py
  #   depends_on:
  #     # The consumer needs both Kafka (to read from) and InfluxDB (to write to).
  #     - kafka
  #     - influxdb
  #   environment:
  #     - KAFKA_BROKER_URL=kafka:29092
  #     - RAW_DATA_TOPIC=raw-data
  #     - ANOMALIES_TOPIC=anomalies
  #     - INFLUXDB_URL=http://influxdb:8086
  #     - INFLUXDB_TOKEN=${INFLUX_TOKEN}
  #     - INFLUXDB_ORG=individual
  #     - INFLUXDB_BUCKET=anomaly-detection

  consumer_autoencoder:
    # To run the LSTM Autoencoder, comment out the 'consumer' block above and uncomment this one
    <<: *python-base-service
    container_name: consumer_autoencoder
    command: python consumer_autoencoder.py
    depends_on:
      - kafka
      - influxdb
    environment:
      - KAFKA_BROKER_URL=kafka:29092
      - RAW_DATA_TOPIC=raw-data
      - ANOMALIES_TOPIC=anomalies
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUX_TOKEN}
      - INFLUXDB_ORG=individual
      - INFLUXDB_BUCKET=anomaly-detection

  alerter:
    <<: *python-base-service
    container_name: alerter
    command: python alerter.py
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER_URL=kafka:29092
      - ANOMALIES_TOPIC=anomalies

  dashboard:
    <<: *python-base-service
    container_name: dashboard
    command: python dashboard.py
    depends_on:
      - influxdb
    # Map port 8050 on the host to port 8050 in the container
    # so we can access the dashboard from our web browser.
    ports:
      - "8050:8050"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUX_TOKEN}
      - INFLUXDB_ORG=individual
      - INFLUXDB_BUCKET=anomaly-detection

  influxdb:
    image: influxdb:2.9.1
    container_name: influxdb
    # This ensures it pulls the native M1 version
    platform: linux/arm64
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=Ayush
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=individual
      - DOCKER_INFLUXDB_INIT_BUCKET=anomaly-detection
      # This is a random 64-character token required by version 2.9.1+ to bypass setup
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    networks:
      - anomaly-detection-network

networks:
  anomaly-detection-network:
    driver: bridge

volumes:
  influxdb-data:
